  <body>
    <main id="demo">
      <noscript>
        <h1>Millpond</h1>
        <p>
          An FFGL effect that puts a pond over your clip: drop a pebble, skim a
          stone or let it rain, and the water follows the water-wave equations
          to the letter. The still disc inside the ring, the long waves racing
          ahead, the caustic net on the bed and the sun's glints all come out of
          the physics rather than being drawn.
        </p>
        <p>
          This demo runs the plugin's shaders in your browser, so it needs
          JavaScript and WebGL2. The plugin itself, its source and its downloads
          are on
          <a href="https://github.com/stoatworks-labs/millpond">its repository</a>.
        </p>
        <ul>
          <li><a href="https://stoatworks-labs.com/software/millpond/">Project page and downloads</a></li>
          <li><a href="https://github.com/stoatworks-labs/millpond">Source on GitHub</a></li>
        </ul>
      </noscript>
    </main>
