name: release

# Build the Millpond FFGL plugin for the two platforms Resolume runs on:
#   - macOS   -> universal (arm64 + x86_64) "Millpond.bundle"
#   - Windows -> x64 "Millpond.dll" (GLEW static via vcpkg)
# Trigger manually (Actions > release > Run workflow) or by pushing a v* tag;
# a workflow_dispatch run builds both platforms and skips publication, which
# is the cheap way to prove Windows still compiles.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-14 and never macos-13: the Intel macOS runners are retired,
          # so x86_64 is cross-compiled from Apple Silicon. CMakeLists.txt's
          # CMAKE_OSX_ARCHITECTURES does that on its own.
          - { name: macos-universal, os: macos-14 }
          - { name: windows-x86_64,  os: windows-latest }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Tools off: mptest links against zlib and CGL and is a developer
      # harness, not something that ships. Its checks run locally via
      # tools/verify.sh.
      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DMILLPOND_BUILD_TOOLS=OFF

      # GLEW comes from vcpkg, static-linked (static-md keeps the CRT dynamic
      # so the plugin matches the host) so the .dll has no external
      # glew32.dll runtime dependency.
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: >
          cmake -B build -A x64
          -DCMAKE_BUILD_TYPE=Release
          -DMILLPOND_BUILD_TOOLS=OFF
          -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Derive version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect artifact
        shell: bash
        run: |
          mkdir -p out
          if [ "${{ runner.os }}" = "macOS" ]; then
            cp -R "build/Millpond.bundle" "out/Millpond.bundle"
            # Sanity-check the bundle really is universal and exports
            # plugMain. An arm64-only build logs as a success, and a bundle
            # that exports nothing loads cleanly and reports that it contains
            # no plugins -- neither failure is visible anywhere else here.
            bin="out/Millpond.bundle/Contents/MacOS/Millpond"
            lipo -archs "$bin"
            # Actions runs `shell: bash` as `bash -eo pipefail`, so `cmd | grep -q X`
            # FAILS when grep FINDS its match: grep exits at once, the writer takes
            # SIGPIPE, and pipefail reports the pipeline as failed -- failing the
            # release on a correct binary. It is output-size dependent, so it bites
            # the biggest artefact first. Captured and matched with `case` instead.
            __archs=$( lipo -archs "$bin" )
            case "$__archs" in
              *x86_64*) ;;
              *) echo "expected x86_64, got: $__archs"; exit 1 ;;
            esac
            __archs=$( lipo -archs "$bin" )
            case "$__archs" in
              *arm64*) ;;
              *) echo "expected arm64, got: $__archs"; exit 1 ;;
            esac
            __symbols=$( nm -gU "$bin" )
            case "$__symbols" in
              *_plugMain*) ;;
              *) echo "expected _plugMain, got: $__symbols"; exit 1 ;;
            esac
          else
            cp "build/Release/Millpond.dll" "out/Millpond.dll"
          fi
          ls -R out

      - name: Archive (zip)
        shell: bash
        run: |
          cd out
          if command -v 7z >/dev/null 2>&1; then
            7z a "../millpond-${{ matrix.name }}.zip" ./*
          else
            zip -r "../millpond-${{ matrix.name }}.zip" ./*
          fi

      - name: Disk image (macOS)
        if: runner.os == 'macOS'
        shell: bash
        # A .dmg, deliberately NOT a .pkg: an FFGL plugin's destination is
        # per-user and edition-specific (~/Documents/Resolume {Arena,Avenue}/
        # Extra Effects), so a .pkg would guess wrong for half of users.
        run: |
          source scripts/release-lib.sh
          rl_init "Millpond" millpond "${{ steps.ver.outputs.version }}" \
            com.stoatworks.millpond "$GITHUB_WORKSPACE"
          cp README.md out/ 2>/dev/null || true
          rl_adhoc_sign "out/Millpond.bundle"
          rl_dmg "${{ matrix.name }}" out

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: millpond-${{ matrix.name }}
          path: |
            *.zip
            *.dmg
          if-no-files-found: error

  windows-installer:
    name: Windows installer
    needs: build
    runs-on: ubuntu-latest
    # makensis cross-compiles, so the installer is wrapped here from the zip
    # the Windows job uploaded. Its directory page defaults to the common FFGL
    # folder but stays editable, because Resolume reads plugins from a path
    # the user chooses per edition.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Install NSIS
        run: sudo apt-get update && sudo apt-get install -y nsis

      - name: Build installer
        shell: bash
        run: |
          source scripts/release-lib.sh
          version="${GITHUB_REF_NAME#v}"
          case "$version" in [0-9]*) ;; *) version="0.0.0" ;; esac
          rl_init "Millpond" millpond "$version" com.stoatworks.millpond "$PWD/installers"
          zip="$(find artifacts -name "millpond-windows-x86_64.zip" | head -1)"
          if [ -z "$zip" ]; then echo "no Windows artefact, nothing to do"; exit 0; fi
          stage="$RUNNER_TEMP/stage-win"
          rm -rf "$stage"; mkdir -p "$stage"
          unzip -q "$zip" -d "$stage"
          cp README.md "$stage/" 2>/dev/null || true
          # --plain: a plugin needs neither a shortcut nor a PATH entry. It was --cli
          # until nib#2 (the same fix, carried over), where the unguarded PATH write wiped a system PATH.
          rl_nsis windows-x86_64 "$stage" --plain
          ls -l installers

      - uses: actions/upload-artifact@v4
        with:
          name: millpond-windows-installer
          path: installers/*
          if-no-files-found: warn

  release:
    name: Publish release
    needs: [build, windows-installer]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
